<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><!-- 폰에서 화면 폭 그대로 -->

<title>보스 시간표</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#1b1d22; }
  canvas { display:block; }
  #copy { position:fixed; top:6px; right:8px; background:#3d7bd9; color:#fff; border:0; border-radius:5px;
          padding:4px 10px; font:12px "Malgun Gothic",sans-serif; cursor:pointer; opacity:.9; }
  #toast { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:#333a46; color:#fff;
           padding:5px 12px; border-radius:5px; font:12px "Malgun Gothic",sans-serif; opacity:0; transition:opacity .2s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="copy">복사</button>
<div id="toast"></div>

<script id="core">
// ---- 정렬 규칙: lib/services/boss_schedule.dart 와 동일 ----
var GRACE = 3600 * 1000; // 재스폰형: 젠 후 1시간까지는 "지남"(빨강)으로 맨 위에 둔다
var DAY = 86400000;
function weekdayOf(d) { var w = d.getDay(); return w === 0 ? 7 : w; } // 월=1 … 일=7
function fixedNext(r, now) {
  for (var d = 0; d <= 8; d++) { // 시각이 지나면 바로 다음 출현(내일/다음 해당 요일)
    var at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, r.h, r.m, 0, 0);
    if (r.days.length && r.days.indexOf(weekdayOf(at)) < 0) continue;
    if (at.getTime() > now.getTime()) return at;
  }
  return null;
}
function atFor(r, now) { return r.respawn ? new Date(r.at) : fixedNext(r, now); }
// 고정 일정(황금색 표시): 매일 21:00 스팟 쟁탈전, 매주 일요일 21:00 공성전 — BossReport.fixedEvents 와 동일
var EVENTS = [
  { name: '공성전', h: 21, m: 0, days: [7], respawn: false, order: -2, event: true },
  { name: '스팟 쟁탈전', h: 21, m: 0, days: [], respawn: false, order: -1, event: true }
];
function upcoming(records, now) {
  var slots = records.concat(EVENTS).map(function (r) { return { r: r, at: atFor(r, now) }; });
  slots.sort(function (a, b) { return (a.at - b.at) || (a.r.order - b.r.order); });
  // 24시간 안에 나오는 것 + 젠 1시간 이내 지난 것만
  return slots.filter(function (s) { return s.at - now < DAY && s.at - now > -GRACE; });
}
function two(v) { return (v < 10 ? '0' : '') + v; }
function hm(at) { return two(at.getHours()) + '시 ' + two(at.getMinutes()) + '분'; }
function clipboardText(records, now) {
  var lines = ['보스 이름\t출현 시간'];
  upcoming(records, now).forEach(function (s) { lines.push(s.r.name + '\t' + hm(s.at)); });
  return lines.join('\n');
}
</script>

<script>
var DATA = /*DATA*/null; // 로컬 파일이면 박혀 있고, 웹 게시본이면 null → data.json을 받아온다
var META = /*META*/null;
var C = { bg:'#1b1d22', line:'#2b2e35', hour:'#3d7bd9', text:'#e8e9ec', sub:'#8d929c', soon:'#ffcf5c', past:'#ff6b6b' };
var FONT = '"Malgun Gothic","맑은 고딕",sans-serif';
var canvas = document.getElementById('c');
var WEEK = ['월', '화', '수', '목', '금', '토', '일'];

function dayDiff(at, now) { // 달력 날짜 차이(자정 기준)
  var a = new Date(at.getFullYear(), at.getMonth(), at.getDate());
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((a - b) / DAY);
}
function dayLabel(at, now) {
  var d = dayDiff(at, now), w = WEEK[weekdayOf(at) - 1];
  return (d === 1 ? '내일' : (at.getMonth() + 1) + '/' + at.getDate()) + ' (' + w + ')';
}

var CARD_W = 360;           // 큰 화면에서는 가운데 이 폭의 카드로(PC 앱 창 크기와 비슷)
var card = { x: 0, y: 0, w: 0, h: 0 }; // 마지막으로 그린 표 영역(복사할 때 이 부분만 자른다)
var GOLD = ['#fff3c4', '#f5cf55', '#c99a1e'];

// 시간대 아이콘(출현 시간 왼쪽): 새벽 0~6시 보라 달+별, 오전 6~12시 주황 해돋이, 낮 12~18시 노랑 해, 밤 18~24시 파랑 달
var PERIODS = [
  { name: '새벽', color: '#b197fc' },
  { name: '오전', color: '#ffa94d' },
  { name: '낮',   color: '#ffd43b' },
  { name: '밤',   color: '#74c0fc' }
];
function periodOf(at) { return PERIODS[Math.floor(at.getHours() / 6)]; }
function moon(g, x, y, r) { // 초승달: 원에서 오른쪽 위로 비킨 원을 뺀다
  g.save();
  g.beginPath(); g.rect(x - r * 2, y - r * 2, r * 4, r * 4); g.arc(x + r * 0.55, y - r * 0.35, r * 0.85, 0, Math.PI * 2);
  g.clip('evenodd');
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.restore();
}
function rays(g, x, y, r1, r2, from, to, n) {
  for (var i = 0; i < n; i++) {
    var a = from + (to - from) * (n === 1 ? 0.5 : i / (n - 1));
    g.beginPath(); g.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); g.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); g.stroke();
  }
}
function periodIcon(g, at, x, y, s) { // (x, y) = 아이콘 가운데, s = 글자 크기
  var p = periodOf(at), r = s * 0.36;
  g.save();
  g.fillStyle = p.color; g.strokeStyle = p.color; g.lineWidth = Math.max(1, s * 0.09); g.lineCap = 'round';
  if (p.name === '낮') {
    g.beginPath(); g.arc(x, y, r * 0.62, 0, Math.PI * 2); g.fill();
    rays(g, x, y, r * 0.95, r * 1.35, 0, Math.PI * 1.75, 8);
  } else if (p.name === '오전') {
    var base = y + r * 0.45;
    g.beginPath(); g.arc(x, base, r * 0.7, Math.PI, 0); g.closePath(); g.fill();
    rays(g, x, base, r * 1.0, r * 1.4, Math.PI * 1.15, Math.PI * 1.85, 3);
    g.beginPath(); g.moveTo(x - r * 1.3, base + r * 0.25); g.lineTo(x + r * 1.3, base + r * 0.25); g.stroke();
  } else if (p.name === '밤') {
    moon(g, x, y, r);
  } else { // 새벽: 작은 달 + 별 하나
    moon(g, x - r * 0.25, y + r * 0.1, r * 0.85);
    g.beginPath(); g.arc(x + r * 0.85, y - r * 0.7, Math.max(0.8, r * 0.18), 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

// 화면 크기에 맞춰 줄 높이·글자 크기를 정해 한 화면에 모두 그린다(스크롤 없음, 한 줄씩).
// 큰 화면(PC 브라우저)은 가운데 카드, 좁은 화면(폰·앱 창)은 화면을 꽉 채운다.
function draw() {
  var now = new Date();
  var rows = upcoming(DATA, now);
  var dpr = window.devicePixelRatio || 1;
  var W = window.innerWidth, H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  var big = W > CARD_W + 48;
  var cw = big ? CARD_W : W;
  var pad = 10;
  var extra = META.missing.length ? 1 : 0;              // 누락 안내 줄
  var dividers = 0, prevDay = 0;                        // 자정 넘는 날짜 구분 줄 수
  rows.forEach(function (s) { var d = s.at <= now ? 0 : dayDiff(s.at, now); if (d > prevDay) { dividers++; prevDay = d; } });
  var lines = rows.length + 2 + extra + dividers;       // 제목줄 + 머리줄 + 보스들 (+누락, 날짜 구분)
  var rowH = Math.min(30, (big ? H - 48 : H - 6) / lines);
  var size = Math.max(8, Math.min(15, rowH * 0.56));
  var ch = rowH * lines + 6;
  var cx = big ? Math.round((W - cw) / 2) : 0;
  var cy = big ? Math.max(24, Math.round((H - ch) / 2)) : 0;
  card = { x: cx, y: cy, w: cw, h: ch };

  g.fillStyle = big ? '#121317' : C.bg; g.fillRect(0, 0, W, H);
  if (big) { // 카드 바탕 + 테두리
    g.fillStyle = C.bg; g.strokeStyle = '#30343d'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1, 8); g.fill(); g.stroke();
  }
  var L = cx + pad, R = cx + cw - pad;

  // 가장 긴 "이름 + 시간"이 한 줄에 들어갈 때까지 글자를 더 줄인다
  function widest(px) {
    g.font = '600 ' + px + 'px ' + FONT;
    var w = 0;
    rows.forEach(function (s) { w = Math.max(w, g.measureText(label(s)).width + g.measureText(' 00시 00분 ').width + px * 1.6); });
    return w;
  }
  function label(s) { return s.r.event ? (s.r.days.length ? '🏰 ' : '⚔ ') + s.r.name : s.r.name; }
  while (size > 8 && widest(size) > cw - pad * 2) size -= 0.5;

  var y = cy;
  function textAt(t, x, color, align, weight, px) {
    g.font = (weight || '') + ' ' + (px || size) + 'px ' + FONT;
    g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
    g.fillText(t, x, y + rowH / 2);
  }
  function hline(color) { g.fillStyle = color; g.fillRect(cx, y, cw, 1); }

  // 제목줄: 기준 시각 (오른쪽은 [복사] 버튼 자리)
  var title = '지금 ' + two(now.getHours()) + ':' + two(now.getMinutes()) + ' 기준', titleColor = C.sub;
  if (META.error) { title += ' · 데이터를 불러오지 못함'; titleColor = C.soon; }
  else if (META.updatedAt) { // 웹 게시본: 마지막으로 올린 시각
    var ago = Math.floor((now - META.updatedAt) / 60000);
    title += ' · 갱신 ' + (ago < 1 ? '방금' : ago + '분 전');
    if (ago >= 40) titleColor = C.soon; // 갱신이 멈춤 → 올리는 PC 확인 필요
  }
  textAt(title, L, titleColor, 'left', '', size * 0.85);
  var btn = document.getElementById('copy'); // [복사] 버튼을 표 오른쪽 위에 맞춘다
  btn.style.top = (cy + Math.max(2, (rowH - 22) / 2)) + 'px';
  btn.style.right = (W - R) + 'px';
  y += rowH;
  if (extra) {
    textAt('누락: ' + META.missing.join(', '), L, C.soon, 'left', '', size * 0.8);
    y += rowH;
  }
  // 머리줄
  textAt('보스 이름', L, C.sub, 'left', '600', size * 0.9);
  textAt('출현 시간', R, C.sub, 'right', '600', size * 0.9);
  y += rowH;
  g.fillStyle = C.line; g.fillRect(cx, y - 1, cw, 1);

  var lastHour = null, lastDay = 0;
  rows.forEach(function (s) {
    var past = s.at <= now, soon = !past && s.at - now <= 10 * 60000;
    // 자정을 넘는 지점에 날짜 구분 줄("내일 (월)")
    var day = past ? 0 : dayDiff(s.at, now);
    if (day > lastDay) {
      hline(C.hour);
      textAt(dayLabel(s.at, now), cx + cw / 2, C.hour, 'center', '600', size * 0.8);
      y += rowH;
      lastDay = day;
      lastHour = null;
    }
    var hour = past ? 'past' : s.at.getDate() + '-' + s.at.getHours();
    hline(lastHour !== null && hour !== lastHour ? C.hour : C.line); // 시간대가 바뀌면 파란 선
    lastHour = hour;

    if (s.r.event) { // 고정 일정: 황금빛 띠 + 금색 그라데이션 글자
      var band = g.createLinearGradient(cx, 0, cx + cw, 0);
      band.addColorStop(0, 'rgba(245,207,85,0.22)'); band.addColorStop(1, 'rgba(245,207,85,0.04)');
      g.fillStyle = band; g.fillRect(cx, y + 1, cw, rowH - 1);
      g.fillStyle = GOLD[1]; g.fillRect(cx, y + 1, 3, rowH - 1);
      var gold = g.createLinearGradient(0, y + rowH * 0.2, 0, y + rowH * 0.8);
      gold.addColorStop(0, GOLD[0]); gold.addColorStop(0.5, GOLD[1]); gold.addColorStop(1, GOLD[2]);
      g.save();
      g.shadowColor = 'rgba(245,207,85,0.55)'; g.shadowBlur = 6;
      textAt(hm(s.at), R, gold, 'right', '700');
      var evTimeW = g.measureText(hm(s.at)).width;
      textAt(label(s), L + 2, gold, 'left', '800');
      g.restore();
      periodIcon(g, s.at, R - evTimeW - size * 0.8, y + rowH / 2, size);
      y += rowH;
      return;
    }
    var color = past ? C.past : soon ? C.soon : C.text;
    textAt(hm(s.at), R, color, 'right', '');
    var timeW = g.measureText(hm(s.at)).width;
    periodIcon(g, s.at, R - timeW - size * 0.8, y + rowH / 2, size);
    timeW += size * 1.6;
    g.save(); g.beginPath(); g.rect(cx, y, cw - pad - timeW, rowH); g.clip(); // 혹시 넘쳐도 시간·아이콘과 겹치지 않게
    textAt(label(s), L, color, 'left', '600');
    g.restore();
    y += rowH;
  });
  card.h = Math.min(H - cy, y - cy + 6); // 실제 마지막 줄까지(복사 범위)
}

function toast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 1400);
}

// [복사] = 표 부분만(아래 빈 공간 제외) PNG 이미지로 클립보드에. 버튼은 캔버스 밖이라 안 찍힌다.
document.getElementById('copy').onclick = function () {
  draw();
  var dpr = window.devicePixelRatio || 1;
  var out = document.createElement('canvas');
  out.width = Math.round(card.w * dpr); out.height = Math.round(card.h * dpr);
  out.getContext('2d').drawImage(canvas, card.x * dpr, card.y * dpr, out.width, out.height, 0, 0, out.width, out.height);
  out.toBlob(function (blob) {
    if (navigator.clipboard && window.ClipboardItem && blob) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function () { toast('이미지 복사됨'); }, copyText);
    } else { copyText(); }
  }, 'image/png');
  function copyText() { // 이미지 복사가 막힌 환경이면 글자로라도
    var ta = document.createElement('textarea'); ta.value = clipboardText(DATA, new Date());
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast('이미지 복사 실패 — 글자로 복사됨');
  }
};

function start() { draw(); window.addEventListener('resize', draw); setInterval(draw, 20000); }
if (DATA) {
  start(); // PC에서 띄운 로컬 파일: 데이터가 박혀 있다
} else {
  // 웹 게시본: 올려진 data.json을 1분마다 다시 받는다(캐시 무시)
  var started = false;
  var load = function () {
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        DATA = j.bosses; META = { missing: j.missing || [], updatedAt: j.updatedAt };
        if (started) draw(); else { started = true; start(); }
      })
      .catch(function () {
        if (!started) { DATA = []; META = { missing: [], error: true }; started = true; start(); }
      });
  };
  load();
  setInterval(load, 60000);
}
</script>
</body>
</html>
